[project]
name = "enola"
version = "0.1.0"
description = "Enola — a personal agent. One user, one machine."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.1",
  "langgraph>=0.4",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-anthropic>=0.3",
  "pgvector>=0.3",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["enola*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "web/", "design/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "apscheduler.*", "langgraph.*", "langchain_core.*", "langchain_anthropic.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
